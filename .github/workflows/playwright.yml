name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true
        id: tests
      - name: Generate test summary
        if: ${{ !cancelled() }}
        run: |
          node -e "
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          const suites = results.suites || [];
          let passed = 0, failed = 0, skipped = 0;
          const details = [];
          function walk(suite) {
            for (const spec of (suite.specs || [])) {
              for (const test of (spec.tests || [])) {
                const status = test.status;
                if (status === 'expected') passed++;
                else if (status === 'unexpected') failed++;
                else skipped++;
                const icon = status === 'expected' ? '✅' : status === 'unexpected' ? '❌' : '⏭️';
                const duration = test.results?.[0]?.duration || 0;
                details.push(icon + ' ' + spec.title + ' (' + (duration / 1000).toFixed(1) + 's)');
              }
            }
            for (const child of (suite.suites || [])) walk(child);
          }
          suites.forEach(walk);
          const total = passed + failed + skipped;
          const duration = (results.stats?.duration || 0) / 1000;
          const status = failed > 0 ? '🔴 FAILED' : '🟢 PASSED';
          let md = '## 🎭 Playwright Test Report\n\n';
          md += '| Status | Total | ✅ Passed | ❌ Failed | ⏭️ Skipped | ⏱️ Duration |\n';
          md += '|--------|-------|----------|----------|-----------|------------|\n';
          md += '| ' + status + ' | ' + total + ' | ' + passed + ' | ' + failed + ' | ' + skipped + ' | ' + duration.toFixed(1) + 's |\n\n';
          md += '### Test Details\n\n';
          details.forEach(d => md += '- ' + d + '\n');
          md += '\n---\n';
          md += '📦 **Artifacts:** Report HTML y videos disponibles en la pestaña Actions\n';
          fs.writeFileSync('test-results/summary.md', md);
          "
      - name: Comment PR with results
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: test-results/summary.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-videos
          path: test-results/**/*.webm
          retention-days: 30
      - name: Fail if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
